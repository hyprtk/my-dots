ignore-empty-password
font="Cantarell"
clock
timestr=%R
datestr=%a, %e of %B
image=~/.cache/current-wallpaper.png
fade-in=1
effect-pixelate=5
indicator
indicator-radius=200
indicator-thickness=20
indicator-caps-lock

# Colors:
key-hl-color={color5.strip}66
separator-color=00000000

inside-color={background.strip}33
inside-clear-color={color2.strip}44
inside-caps-lock-color={color3.strip}44
inside-ver-color={color4.strip}44
inside-wrong-color={color1.strip}44

ring-color={color6.strip}
ring-clear-color={color2.strip}
ring-caps-lock-color={color3.strip}
ring-ver-color={color4.strip}
ring-wrong-color={color1.strip}

line-color={color6.strip}66
line-clear-color={color2.strip}FF
line-caps-lock-color={color3.strip}FF
line-ver-color={color4.strip}FF
line-wrong-color={color1.strip}FF

text-color={foreground.strip}
text-clear-color={color2.strip}
text-ver-color={color4.strip}
text-wrong-color={color1.strip}

bs-hl-color={color1.strip}
caps-lock-key-hl-color={color3.strip}FF
caps-lock-bs-hl-color={color3.strip}FF
disable-caps-lock-text
text-caps-lock-color={color3.strip}
