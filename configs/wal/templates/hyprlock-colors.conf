# pywal → hyprlock colour variables.
# Rendered to ~/.cache/wal/hyprlock-colors.conf and sourced by hypr/hyprlock.conf.
# {colorN.strip} is the bare RRGGBB (no leading '#'); a 2-digit alpha hex is
# appended for translucent fills. hyprlock colour syntax: rgb(RRGGBB) /
# rgba(RRGGBBAA). Regenerated on every wallpaper change.
#
# Mapping mirrors the old swaylock config (configs/swaylock/config):
#   outer_color  ← ring-color          (color6)
#   inner_color  ← inside-color        (color0 + alpha)
#   check_color  ← inside-ver-color    (color2 + alpha)
#   fail_color   ← inside-wrong-color  (color1 + alpha)
#   capslock_color ← inside-caps-lock-color (color5 + alpha)
#   font_color   ← text-color          (foreground)

$lock_ring   = rgb({color6.strip})
$lock_inside = rgba({color0.strip}44)
$lock_ver    = rgba({color2.strip}44)
$lock_wrong  = rgba({color1.strip}44)
$lock_caps   = rgba({color5.strip}44)
$lock_text   = rgb({foreground.strip})
