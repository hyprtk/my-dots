# Matuwall — hyprtk wallpaper picker (static fallback).
#
# The installer points ~/.config/matuwall/config.toml at the pywal-rendered
# config (configs/wal/templates/matuwall-config.toml) so the picker follows the
# wallpaper; this file is used only when pywal has not rendered yet. Schema per
# matuwall 0.3.x (src/config/config.c).

[general]
directory = "~/Pictures/Wallpapers"
backend = "auto"

[backend.sweetbg]
args = []

[backend.awww]
args = []

[backend.plasma]
args = []

[backend.command]
apply = ""

[window]
preview = false
close_on_focus_loss = false
position = "left"
background = "#1a1b26f2"
margin = 34
edge_margin = 45
radius = 40

[input]
mouse = true

[animation]
navigation_ms = 410
zoom_percent = 10

[grid]
columns = 4
spacing = 16
radius = 20
border_width = 0
shadow_width = 12
ring_width = 0
visible_rows = 1
carousel = true
edge = "auto"

[thumbnail]
width = 300
height = 169

[colors]
tile = "#1a1b26ff"
border = "#585b70ff"
shadow = "#00000066"
ring = "#c084fcff"
spinner = "#22d3eeff"

[hooks]
# Regenerate the pywal palette when a wallpaper is applied (matuwall substitutes
# {path}).
on_apply = [ "wal -i {path} -n" ]
