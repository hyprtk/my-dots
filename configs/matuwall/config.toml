# Matuwall — hyprtk wallpaper picker (static fallback).
#
# The installer points ~/.config/matuwall/config.toml at the pywal-rendered
# config (configs/wal/templates/matuwall-config.toml) so the picker follows the
# wallpaper; this file is used only when pywal has not rendered yet. Schema per
# src/config/config.c (upstream's config/example.toml is stale — the grid keys
# belong under [grid]).

[general]
# Wallpaper directory (also the built-in default).
directory = "~/Pictures/Wallpapers"
backend = "auto"

[window]
position = "left"            # the old panel_edge
background = "#1a1b26f2"
edge_margin = 45             # the old panel_margin_top
close_on_focus_loss = false  # the old keep_ui_alive

[input]
mouse = true                 # the old mouse_enabled (the new default is false)

[grid]
columns = 4                  # the old panel_thumbs_col
spacing = 16
radius = 20
border_width = 0
shadow_width = 12
ring_width = 0
visible_rows = 1
carousel = true
edge_peek = false

[thumbnail]
width = 300
height = 169

[colors]
tile = "#1a1b26ff"
border = "#585b70ff"
shadow = "#00000066"
ring = "#c084fcff"
spinner = "#22d3eeff"

[hooks]
# Regenerate the pywal palette when a wallpaper is applied (matuwall substitutes
# {path}).
on_apply = [ "wal -i {path} -n" ]
