# ── hypridle.conf — hyprtk ──────────────────────────────────────────────────
# Idle management; replaces the old swayidle invocation that used to live in
# installer/scripts/lockscreentime.sh. Started from hypr/autostart.lua.
# See knowledge/migrating-to-hyprlock-hypridle.md.
#
# Locking is centralized on logind: every route into the lock — the idle
# listener, a `loginctl lock-session` keybind, and sleeping — emits logind's
# Lock signal, and hypridle answers it with general:lock_cmd. That runs the
# lock.sh supervisor (single-instance flock + restart-on-death), which the
# hypr-watchdog reads to know the session is locked.
#
# inhibit_sleep = 3 is REQUIRED here, not the default 2: auto (2) only
# recognizes hyprlock when lock_cmd/before_sleep_cmd contain the literal string
# "hyprlock", and lock_cmd names lock.sh instead — so 2 would silently fall
# back to 1, which the wiki says is not enough for `loginctl lock-session`.
# Mode 3 waits for hyprland-lock-notify-v1 and works with any session-lock app.
# ─────────────────────────────────────────────────────────────────────────────

general {
    # Do not stack lockers: if hyprlock is already up, do nothing; otherwise
    # run the supervisor (which has its own flock single-instance guard).
    lock_cmd         = pidof hyprlock || ~/.config/hypr/scripts/lock.sh
    # Ask logind to lock before sleeping; hypridle then runs lock_cmd.
    before_sleep_cmd = loginctl lock-session
    # Wake the display without needing a second keypress (was: resume dpms on).
    after_sleep_cmd  = ~/.config/hypr/scripts/dpms.sh on
    # ignore_dbus_inhibit    = false
    # ignore_systemd_inhibit = false
    # ignore_wayland_inhibit = false
    inhibit_sleep    = 3
}

# Idle → lock (was: swayidle `timeout 600 lock.sh -f`)
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Idle → screen off; activity → screen on
# (was: swayidle `timeout 660 dpms.sh off` / `resume dpms.sh on`)
listener {
    timeout = 660
    on-timeout = ~/.config/hypr/scripts/dpms.sh off
    on-resume  = ~/.config/hypr/scripts/dpms.sh on
}
