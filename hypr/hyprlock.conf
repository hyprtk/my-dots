# ── hyprlock.conf — hyprtk ──────────────────────────────────────────────────
# Hyprland's GPU-accelerated screen locker. See
# knowledge/migrating-to-hyprlock-hypridle.md.
#
# Colors are pywal-driven: the wal template
#   configs/wal/templates/hyprlock-colors.conf
# renders to ~/.cache/wal/hyprlock-colors.conf on every wallpaper change and is
# sourced below (it redefines the $lock_* variables). The static fallbacks here
# keep the lock usable even before the first wal run — note that a `source=`
# whose glob finds no file is logged as a config error, so the fragment must
# always exist (the installer's `wal -n` run renders it).
# ─────────────────────────────────────────────────────────────────────────────

# color fallbacks (overridden by the sourced pywal fragment)
$lock_ring   = rgb(AD9987)
$lock_inside = rgba(0F182544)
$lock_ver    = rgba(65A79844)
$lock_wrong  = rgba(5F5A5844)
$lock_caps   = rgba(614E9444)
$lock_text   = rgb(C3C5C8)

source = ~/.cache/wal/hyprlock-colors.conf

general {
    hide_cursor       = true
    ignore_empty_input = true
    # fractional_scaling = 2   # 0 off / 1 on / 2 auto
}

auth {
    # pam is enabled by default (auth:pam:enabled = true); uncomment for fprintd
    # fingerprint {
    #     enabled = true
    #     ready_message = Scan fingerprint to unlock
    #     present_message = Scanning...
    # }
}

animations {
    enabled = true
    # The lock surface counts as "locked" before fade-in finishes; if a
    # translucent flash shows the desktop on resume, disable fade-in (or run
    # `hyprlock --no-fade-in`). See hypridle#146.
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Background: the current pywal wallpaper (was: swaylock `image=`), blurred.
# Use `path = screenshot` instead to lock over a snapshot of the live desktop.
background {
    monitor =
    path = ~/.cache/current-wallpaper.png
    blur_passes = 2
    blur_size = 6
    # color = rgba(0f182544)   # shown until `path` loads (or if it is empty)
}

# Password indicator (was: swaylock `indicator-radius=200` /
# `indicator-thickness=20` / `rounding`). A square `size` with `rounding = -1`
# gives the circular ring; `outline_thickness` is the ring width.
input-field {
    monitor =
    size = 400, 400
    rounding = -1
    outline_thickness = 20
    inner_color  = $lock_inside        # was: inside-color
    outer_color  = $lock_ring          # was: ring-color
    check_color  = $lock_ver           # was: inside-ver-color
    fail_color   = $lock_wrong         # was: inside-wrong-color
    capslock_color = $lock_caps        # was: inside-caps-lock-color
    font_color   = $lock_text          # was: text-color
    font_family  = Cantarell
    placeholder_text = <i>Password...</i>
    fail_text  = <i>$FAIL <b>($ATTEMPTS)</b></i>
    check_text = <i>Verifying...</i>
    dots_size = 0.25
    dots_spacing = 0.2
    position = 0, -80
    halign = center
    valign = center
}

# Clock (was: swaylock-effects `clock` + `timestr=%R`)
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = Cantarell
    color = $lock_text
    position = 0, 340
    halign = center
    valign = center
}

# Date (was: swaylock-effects `datestr=%a, %e of %B`)
label {
    monitor =
    text = cmd[update:60000] date +"%a, %e of %B"
    font_size = 24
    font_family = Cantarell
    color = $lock_text
    position = 0, 260
    halign = center
    valign = center
}
