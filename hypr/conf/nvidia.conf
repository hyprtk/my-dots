# ------------------------------------------------------------------
# NVIDIA Specific Config - Enable/Disable as required
#
# Install qt5-wayland, qt6-wayland, qt5ct, qt6ct and libva.
#
# Additionally libva-nvidia-driver-git (AUR) to fix crashes in some
# Electron-based applications, such as Unity Hub.
#
# Install the nvidia-open-dkms driver and add it to your initramfs
# and kernel parameters.
#
# For systemd-boot: add nvidia_drm.modeset=1 to the end of
# /boot/loader/entries/arch.conf.
#
# For GRUB: add nvidia_drm.modeset=1 to GRUB_CMDLINE_LINUX_DEFAULT
# in /etc/default/grub, then run grub-mkconfig.
#
# In /etc/mkinitcpio.conf add to MODULES:
#   nvidia nvidia_modeset nvidia_uvm nvidia_drm
# Then run mkinitcpio -P.
#
# Create /etc/modprobe.d/nvidia.conf with:
#   options nvidia-drm modeset=1
#
# Environment variables set by nvidia.lua:
#   __NV_PRIME_RENDER_OFFLOAD=1
#   __GLX_VENDOR_LIBRARY_NAME=nvidia
#   GBM_BACKEND=nvidia-drm
#   LIBVA_DRIVER_NAME=nvidia
# ------------------------------------------------------------------
