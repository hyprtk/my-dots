# Cross-distro install matrix.
#
# Proves `install.sh` installs the bar cleanly on every supported distro
# family: it runs the dry-run (detection + dependency report), then a real
# `--no-extras` install (GTK4 + gtk4-layer-shell typelibs + PyGObject via the
# package manager + the --system-site-packages venv) and finally imports
# GTK4/Gtk4LayerShell in the installed venv — the same check the installer's own
# self-test performs.
#
# Debian/Ubuntu have no gtk4-layer-shell GI package, so those jobs build
# gtk4-layer-shell from source with introspection (the same thing the
# multi-distro `srcapps-install.sh` does on real installs).
#
# Gentoo (emerge) and NixOS (flake) are handled separately — they are not
# package-manager-detectable in a throwaway container.
name: install-matrix

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: arch
            image: archlinux:latest
            bootstrap: pacman -Sy --noconfirm git
          - distro: debian-bookworm
            image: debian:bookworm
            bootstrap: apt-get update && apt-get install -y git
          - distro: ubuntu-noble
            image: ubuntu:24.04
            bootstrap: apt-get update && apt-get install -y git
          - distro: fedora
            image: fedora:latest
            bootstrap: dnf install -y git
          - distro: opensuse-tumbleweed
            image: opensuse/tumbleweed
            bootstrap: zypper --non-interactive install git
          - distro: void
            image: voidlinux/voidlinux:latest
            bootstrap: xbps-install -Sy git
          - distro: alpine
            image: alpine:latest
            # Alpine has no bash by default (install.sh needs it), and git for checkout.
            bootstrap: apk add --no-cache git bash
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Bootstrap (${{ matrix.distro }})
        run: ${{ matrix.bootstrap }}

      - uses: actions/checkout@v4

      # Debian/Ubuntu ship no gtk4-layer-shell GI typelib; build it from source
      # (introspection on) so the bar can import Gtk4LayerShell. This mirrors
      # installer/scripts/srcapps-install.sh in the multi-distro installer.
      - name: gtk4-layer-shell (source build)
        if: matrix.distro == 'debian-bookworm' || matrix.distro == 'ubuntu-noble'
        run: |
          apt-get install -y build-essential meson ninja-build pkg-config \
            libgtk-4-dev libwayland-dev wayland-protocols \
            gobject-introspection libgirepository1.0-dev
          git clone --depth=1 --branch v1.3.0 https://github.com/wmww/gtk4-layer-shell.git /tmp/g4
          cd /tmp/g4
          meson setup build --prefix=/usr -Dvapi=false -Dintrospection=true \
            -Dexamples=false -Ddocs=false
          ninja -C build
          ninja -C build install
          ldconfig

      - name: Dry run
        run: ./install.sh --dry-run

      - name: Install (core deps, no extras)
        run: ./install.sh --no-extras

      - name: Bundled pywal16 (wal) self-test
        run: |
          test -x "$HOME/.local/share/hyprtk-bar/venv/bin/wal"
          "$HOME/.local/bin/wal" -v

      - name: Import self-test
        run: |
          "$HOME/.local/share/hyprtk-bar/venv/bin/python3" - <<'PY'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Gtk4LayerShell", "1.0")
          from gi.repository import Gtk, Gtk4LayerShell
          import hyprtk_bar
          print("hyprtk-bar imports OK")
          PY
