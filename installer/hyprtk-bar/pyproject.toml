[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprtk-bar"
version = "0.1.0"
description = "Hyprtk taskbar for Hyprland (GTK3 + layer shell)"
requires-python = ">=3.10"
dependencies = [
    "pygobject>=3.48",
    "dbus-next>=0.2.3,<0.3",
]

[project.scripts]
hyprtk-bar = "hyprtk_bar.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]